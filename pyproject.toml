
[project]
name = "llmops-tutorials"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "abhishek-saurav", email = "abhishek.saurav83@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "deepeval>=4.2.8",
    "ipykernel>=7.3.0",
    "langchain>=1.4.2",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.5",
    "langchain-openai>=1.6.6",
    "langchain-text-splitters>=1.1.2",
    "langfuse>=4.17.0",
    "langgraph>=1.2.12",
    "mlflow>=3.17.0",
    "python-dotenv>=1.2.3",
    "streamlit>=1.64.0",
]

[project.scripts]
llmops-tutorials = "llmops_tutorials:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/app",
    "src/config",
    "src/data",
    "src/evals",
    "src/llmops_tutorials",
]
